name: Analyze, Test and Build APK

on:
  push:
    branches: [ "main", "fix-quran-teacher" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}

      - name: Get dependencies
        id: dependencies
        run: flutter pub get

      - name: Check Dart formatting (changed files only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t dart_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No Dart files changed; skipping format check."
          else
            dart format --output=none --set-exit-if-changed "${dart_files[@]}"
          fi

      - name: Analyze Dart code
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: flutter analyze

      - name: Run Flutter tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: flutter test

      - name: Build release APKs
        id: apk
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        if: ${{ always() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: itqan-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
