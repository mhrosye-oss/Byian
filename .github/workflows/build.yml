name: Analyze, Test and Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Get dependencies
        id: dependencies
        run: flutter pub get --enforce-lockfile

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: itqan-pubspec-lock-${{ github.sha }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        if: ${{ always() && !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test

      # Keep analysis/test failures visible, but still attempt a diagnostic APK.
      - name: Build release APKs (debug-signed)
        id: apk
        if: ${{ always() && !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter build apk --release --split-per-abi

      - name: Upload debug-signed APK artifacts
        if: ${{ always() && !cancelled() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: itqan-android-release-debug-signed-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      # Linux GitHub-hosted runners expose KVM, but the runner user needs access.
      - name: Enable Android emulator acceleration
        if: ${{ always() && !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test startup and launch the release APK on Android
        if: ${{ always() && !cancelled() && steps.apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android_startup_smoke.sh

      - name: Upload Android startup diagnostics
        if: ${{ always() && !cancelled() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: itqan-android-startup-diagnostics-${{ github.sha }}
          path: build/startup-diagnostics/
          if-no-files-found: warn
          retention-days: 14
