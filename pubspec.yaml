name: itqan
description: Quran pronunciation and memorization app
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  qcf_quran_plus: ^0.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Existing dependencies
  intl: ^0.20.3
  just_audio: ^0.9.36
  record: 5.0.4  # Strict version to prevent Dart 3.12.0 requirement
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.8

  # New dependencies for our services
  geolocator: ^14.0.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  shared_preferences: ^2.0.0
  flutter_compass: ^0.8.0
  hijri: ^3.0.0
  adhan: ^2.0.0+1
  flutter_timezone: ^5.1.1
  speech_to_text: ^7.5.0

# Fix for AGP 8 compatibility and SDK version issues
dependency_overrides:
  record_android: 1.4.0
  record_linux: 1.3.1
  geolocator_android: 4.6.1
  package_info_plus: 8.3.1
  record: 5.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/data/
    - assets/audio/

  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
